<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>勁揚業務管家 Backend Service</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .landing-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    p {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .app-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
    }
    .app-button:hover {
      background-color: var(--accent-hover);
    }
    .app-button:active {
      transform: scale(0.98);
    }
    .footer-text {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="badge">API Service Endpoint</div>
    <h1>勁揚業務管家 Backend Service</h1>
    <p>此網址為系統的後端 API 與試算表資料服務端點，並非日常 App 使用者操作介面。請點擊下方按鈕前往正式 App。</p>
    <a href="https://brown-phi.vercel.app/" class="app-button" target="_top">
      🚀 開啟勁揚業務管家 App
    </a>
    <div class="footer-text">
      Jingyang Sales Assistant &copy; 2026
    </div>
  </div>
</body>
</html>
